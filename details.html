<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Details | Hadi's Legal Wisdom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: white; }
        .article-content { max-width: 800px; margin: auto; padding: 40px 20px; line-height: 1.8; font-size: 1.1rem; }
        .story-box { background: #fef9e7; border-left: 5px solid #f1c40f; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container py-5">
        <a href="index.html" class="btn btn-link text-decoration-none mb-4">← হোম পেজে ফিরে যান</a>
        <div id="postContent" class="article-content">
            </div>
    </div>

    <script>
        const viewId = localStorage.getItem('currentViewId');
        const posts = JSON.parse(localStorage.getItem('legalPosts')) || [];
        const post = posts.find(p => p.id == viewId);

        if(post) {
            document.getElementById('postContent').innerHTML = `
                <span class="text-warning fw-bold">${post.badge}</span>
                <h1 class="display-5 fw-bold mb-3">${post.title}</h1>
                <p class="text-muted">প্রকাশিত: ${post.date} | লেখক: হাদী</p>
                <hr>
                <div class="story-box">
                    ${post.full.replace(/\n/g, '<br>')}
                </div>
            `;
        }
    </script>
</body>
</html>
