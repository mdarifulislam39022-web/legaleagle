<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Hadi's Legal Wisdom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f2f5; }
        .admin-card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-publish { background: #e67e22; color: white; font-weight: 600; border: none; }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card admin-card p-4">
                    <h2 class="text-center mb-4 fw-bold">নতুন গল্প যোগ করুন</h2>
                    <form id="postForm">
                        <div class="mb-3">
                            <label class="form-label">গল্পের শিরোনাম (Title)</label>
                            <input type="text" id="postTitle" class="form-control" placeholder="যেমন: ধারা ৩: মামলা খারিজ" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">পর্ব ও ধারা (Badge)</label>
                            <input type="text" id="postBadge" class="form-control" placeholder="যেমন: তামাদি আইন: পর্ব-০১" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">সংক্ষিপ্ত বর্ণনা (Short Intro)</label>
                            <textarea id="postShort" class="form-control" rows="2" placeholder="হোমপেজে যা দেখাবে..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">পুরো গল্প ও বিস্তারিত (Full Story)</label>
                            <textarea id="postFull" class="form-control" rows="10" placeholder="এখানে পুরো গল্পটি লিখুন..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-publish w-100 p-3">সাইটে পাবলিশ করুন</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const post = {
                id: Date.now(),
                title: document.getElementById('postTitle').value,
                badge: document.getElementById('postBadge').value,
                short: document.getElementById('postShort').value,
                full: document.getElementById('postFull').value,
                date: new Date().toLocaleDateString('bn-BD')
            };

            let posts = JSON.parse(localStorage.getItem('legalPosts')) || [];
            posts.unshift(post);
            localStorage.setItem('legalPosts', JSON.stringify(posts));

            alert('গল্পটি সফলভাবে পাবলিশ হয়েছে!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
