<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Hadi's Legal Wisdom | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8f9fa; }
        .post-card { transition: 0.3s; border: none; border-radius: 12px; cursor: pointer; }
        .post-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .navbar { background: #2c3e50; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Hadi's <span class="text-warning">Legal Wisdom</span></a>
            <a href="admin.html" class="btn btn-outline-warning btn-sm">Admin Access</a>
        </div>
    </nav>

    <div class="container my-5">
        <h3 class="mb-4 fw-bold">সিরিজ: গল্পে গল্পে তামাদি আইন</h3>
        <div id="postContainer" class="row">
            </div>
    </div>

    <script>
        const posts = JSON.parse(localStorage.getItem('legalPosts')) || [];
        const container = document.getElementById('postContainer');

        if(posts.length === 0) {
            container.innerHTML = '<p class="text-center">এখনো কোনো গল্প পাবলিশ করা হয়নি। এডমিন প্যানেলে যান।</p>';
        }

        posts.forEach(post => {
            container.innerHTML += `
                <div class="col-md-6 mb-4">
                    <div class="card post-card shadow-sm h-100" onclick="viewPost(${post.id})">
                        <div class="card-body">
                            <span class="badge bg-warning text-dark mb-2">${post.badge}</span>
                            <h2 class="h4 fw-bold">${post.title}</h2>
                            <p class="text-muted small">${post.date}</p>
                            <p class="card-text text-secondary">${post.short}</p>
                            <span class="text-primary fw-bold">বিস্তারিত পড়ুন →</span>
                        </div>
                    </div>
                </div>
            `;
        });

        function viewPost(id) {
            localStorage.setItem('currentViewId', id);
            window.location.href = 'details.html';
        }
    </script>
</body>
</html>
