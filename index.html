<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Smart Exam Tracker | Md. Ariful Islam</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --glass: rgba(255, 255, 255, 0.08); --success: #2ecc71; --accent: #3498db; }
        body {
            background: linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.92)), 
                        url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-attachment: fixed; color: #f4f4f4;
            font-family: 'Hind Siliguri', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        .master-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 25px; width: 100%; max-width: 1250px; 
            align-items: stretch; 
        }

        .card { 
            background: var(--glass); padding: 25px; border-radius: 18px; 
            border-top: 5px solid var(--accent); backdrop-filter: blur(10px); 
            display: flex; flex-direction: column; height: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s;
        }
        
        /* Done হলে এই স্টাইল হবে */
        .card.is-done { border-top-color: var(--success); opacity: 0.85; }
        .card.is-done .badge { background: var(--success) !important; }

        .title { font-size: 1.25rem; color: var(--gold); font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.7rem; background: var(--accent); padding: 3px 10px; border-radius: 8px; color: #fff; }

        textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 10px; color: #eee; padding: 15px; font-family: inherit; flex-grow: 1; min-height: 100px; resize: none; margin-bottom: 15px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .save-btn { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 2; }
        .done-btn { background: transparent; color: #fff; border: 1px solid #666; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1; font-size: 0.8rem; }
        
        .save-btn:hover { background: #fff; }
        .done-btn:hover { border-color: var(--success); color: var(--success); }

        h1 { margin-bottom: 10px; text-shadow: 2px 2px 10px #000; text-align: center; }
        p.sub { margin-bottom: 30px; color: #aaa; }
    </style>
</head>
<body>

    <h1>Md. Ariful Islam | Smart Tracker</h1>
    <p class="sub">পরীক্ষার তারিখ পার হলে অটোমেটিক "DONE" হয়ে যাবে</p>
    
    <div class="master-grid" id="exam-grid"></div>

    <script>
        // তোমার পরীক্ষার ডাটা (তারিখগুলো ঠিক আছে কি না দেখে নিও বন্ধু)
        const courses = [
            { id: "311", code: "LAW 311", name: "Criminal Procedure", date: "2026-03-05" },
            { id: "313", code: "LAW 313", name: "Civil Procedure", date: "2026-03-08" },
            { id: "317", code: "LAW 317", name: "Intellectual Property", date: "2026-03-10" },
            { id: "315", code: "LAW 315", name: "Registration & Limitation", date: "2026-03-12" },
            { id: "319", code: "LAW 319", name: "Professional Ethics", date: "2026-03-14" }
        ];

        const grid = document.getElementById('exam-grid');
        const now = new Date();

        courses.forEach(c => {
            const examDate = new Date(c.date);
            // অটো-ডান চেক: তারিখ পার হয়েছে কি না অথবা ম্যানুয়ালি সেভ করা আছে কি না
            const isManualDone = localStorage.getItem('done_' + c.id) === 'true';
            const isAutoDone = now > examDate;
            const finalDone = isManualDone || isAutoDone;

            grid.innerHTML += `
                <div class="card ${finalDone ? 'is-done' : ''}" id="card-${c.id}">
                    <div class="title">
                        ${c.code} 
                        <span class="badge" id="badge-${c.id}">${finalDone ? 'DONE ✅' : 'UPCOMING'}</span>
                    </div>
                    <div style="margin-bottom: 10px; font-weight: 600; color: #ddd;">${c.name}</div>
                    <div style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">Date: ${c.date}</div>
                    <textarea id="note-${c.id}" placeholder="সাজেশন বা রিভিশন নোটস..."></textarea>
                    
                    <div class="btn-group">
                        <button class="save-btn" onclick="save('${c.id}')">সেভ নোট</button>
                        <button class="done-btn" onclick="toggleDone('${c.id}')">
                            ${finalDone ? 'Undo' : 'Done'}
                        </button>
                    </div>
                </div>`;
        });

        function save(id) {
            const val = document.getElementById('note-' + id).value;
            localStorage.setItem('note_v6_' + id, val);
            alert('নোট সেভ হয়েছে! ✅');
        }

        function toggleDone(id) {
            const current = localStorage.getItem('done_' + id) === 'true';
            localStorage.setItem('done_' + id, !current);
            location.reload(); // পরিবর্তন দেখানোর জন্য পেজ রিফ্রেশ
        }

        window.onload = function() {
            courses.forEach(c => {
                const savedNote = localStorage.getItem('note_v6_' + c.id);
                if(savedNote) document.getElementById('note-' + id).value = savedNote;
            });
        };
    </script>
</body>
</html>
