<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Perfect Master Dashboard | Md. Ariful Islam</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --glass: rgba(255, 255, 255, 0.1); --success: #2ecc71; }
        body {
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-attachment: fixed; color: #f4f4f4;
            font-family: 'Hind Siliguri', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        /* কার্ডের উচ্চতা সমান রাখার জন্য মেইন গ্রিড */
        .master-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 25px; width: 100%; max-width: 1250px; 
            align-items: stretch; /* সমান উচ্চতা নিশ্চিত করে */
        }

        .card { 
            background: var(--glass); padding: 25px; border-radius: 15px; 
            border-top: 4px solid var(--gold); backdrop-filter: blur(10px); 
            display: flex; flex-direction: column; height: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* স্পেশাল ফিনিশড কার্ড */
        .card.done { border-top-color: var(--success); background: rgba(46, 204, 113, 0.05); }

        .main-timer { text-align: center; background: rgba(212, 175, 55, 0.1); padding: 25px; border-radius: 20px; border: 1px solid var(--gold); margin-bottom: 35px; width: 95%; max-width: 800px; }
        .timer-grid { display: flex; justify-content: center; gap: 15px; font-size: 2.2rem; font-weight: bold; }
        .unit { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; min-width: 80px; border: 1px solid var(--gold); }
        .unit small { display: block; font-size: 0.8rem; color: #aaa; text-transform: uppercase; }

        .title { font-size: 1.2rem; color: var(--gold); font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.7rem; background: var(--success); padding: 2px 8px; border-radius: 5px; color: #fff; }

        textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 8px; color: #eee; padding: 12px; font-family: inherit; flex-grow: 1; resize: none; margin-bottom: 10px; }
        .save-btn { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .save-btn:hover { background: #fff; transform: translateY(-2px); }

        .settings-icon { position: fixed; bottom: 20px; right: 20px; background: var(--gold); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div class="main-timer">
        <h2 id="next-exam-title" style="margin-bottom: 15px; color: var(--gold);">Target: Intellectual Property</h2>
        <div class="timer-grid">
            <div class="unit"><span id="d">00</span><small>দিন</small></div>
            <div class="unit"><span id="h">00</span><small>ঘণ্টা</small></div>
            <div class="unit"><span id="m">00</span><small>মিনিট</small></div>
            <div class="unit"><span id="s">00</span><small>সেকেন্ড</small></div>
        </div>
    </div>

    <h1 style="margin-bottom: 30px; text-shadow: 2px 2px 10px #000;">Md. Ariful Islam | Exam Dashboard</h1>
    
    <div class="master-grid" id="grid">
        <div class="card done">
            <div class="title">LAW 311: CrPC <span class="badge">COMPLETED</span></div>
            <textarea id="note-0" placeholder="রিভিশন নোটস..."></textarea>
            <button class="save-btn" onclick="save(0)">সেভ করো</button>
        </div>

        <div class="card done">
            <div class="title">LAW 313: CPC <span class="badge">COMPLETED</span></div>
            <textarea id="note-1" placeholder="রিভিশন নোটস..."></textarea>
            <button class="save-btn" onclick="save(1)">সেভ করো</button>
        </div>

        <div class="card">
            <div class="title">LAW 317: Intellectual Property</div>
            <textarea id="note-2" placeholder="সাজেশন এখানে লেখো..."></textarea>
            <button class="save-btn" onclick="save(2)">সেভ করো</button>
        </div>

        <div class="card">
            <div class="title">LAW 315: Registration</div>
            <textarea id="note-3" placeholder="সাজেশন এখানে লেখো..."></textarea>
            <button class="save-btn" onclick="save(3)">সেভ করো</button>
        </div>

        <div class="card">
            <div class="title">📖 My Legal Thoughts</div>
            <textarea id="note-diary" style="min-height: 150px;" placeholder="আজকের আইনি বিশ্লেষণ..."></textarea>
            <button class="save-btn" onclick="save('diary')">ডায়েরি সেভ করো</button>
        </div>

        <div class="card">
            <div class="title">🛡️ Exam Checklist</div>
            <div style="margin-bottom: 15px;">
                <input type="checkbox" id="c1"> Admit Card<br>
                <input type="checkbox" id="c2"> SIU ID Card<br>
                <input type="checkbox" id="c3"> Registration<br>
                <input type="checkbox" id="c4"> Pens & Scale
            </div>
            <button class="save-btn" onclick="save('check')">চেকলিস্ট সেভ করো</button>
        </div>
    </div>

    <script>
        // সেভ ফাংশন (Local Storage)
        function save(id) {
            const val = document.getElementById('note-' + id).value;
            localStorage.setItem('arif_note_' + id, val);
            alert('সফলভাবে সেভ হয়েছে! ✅');
        }

        // লোড ফাংশন
        window.onload = function() {
            const ids = [0, 1, 2, 3, 'diary'];
            ids.forEach(id => {
                const saved = localStorage.getItem('arif_note_' + id);
                if(saved) document.getElementById('note-' + id).value = saved;
            });
        };

        // টাইমার লজিক (Intellectual Property - March 10, 10:00 AM)
        const target = new Date("March 10, 2026 10:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            if(diff > 0) {
                document.getElementById('d').innerText = Math.floor(diff / 86400000);
                document.getElementById('h').innerText = Math.floor((diff % 86400000) / 3600000);
                document.getElementById('m').innerText = Math.floor((diff % 3600000) / 60000);
                document.getElementById('s').innerText = Math.floor((diff % 60000) / 1000);
            } else {
                document.getElementById('next-exam-title').innerText = "Exam Ongoing/Completed";
            }
        }, 1000);
    </script>
</body>
</html>
