<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কাজ চলমান | Hadi's Legal Wisdom</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        /* ব্যাকগ্রাউন্ড ডিজাইন */
        .bg-img {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            height: 100%;
            background-position: center;
            background-size: cover;
            position: relative;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .content-box {
            padding: 20px;
            max-width: 800px;
        }

        h1 { font-size: 3.5rem; font-weight: 700; color: #ffc107; }
        p { font-size: 1.2rem; margin-bottom: 30px; }

        /* কাউন্টার ডিজাইন */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            min-width: 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        .time-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .time-box label {
            font-size: 1rem;
            text-transform: uppercase;
            color: #ffc107;
        }

        .badge-coming {
            background: #e67e22;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="bg-img">
        <div class="content-box">
            <div class="badge-coming">সাইটের কাজ চলমান</div>
            <h1>Hadi's Legal Wisdom</h1>
            <p>আমরা আমাদের ওয়েবসাইটটিকে আরও আধুনিক ও সমৃদ্ধ করছি। গল্পে গল্পে আইন শেখার নতুন অভিজ্ঞতা নিয়ে আসছি খুব শীঘ্রই।</p>
            
            <div class="countdown-container" id="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <label>দিন</label>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <label>ঘণ্টা</label>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <label>মিনিট</label>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <label>সেকেন্ড</label>
                </div>
            </div>

            <div class="mt-5">
                <small class="text-white-50">যোগাযোগ: legaleagle.arif@gmail.com</small>
            </div>
        </div>
    </div>

    <script>
        // লক্ষ্য নির্ধারণ: আপনি এখানে আপনার পছন্দমতো তারিখ দিতে পারেন
        // উদাহরণস্বরূপ: ২০২৬ সালের ১ অক্টোবর
        var countDownDate = new Date("Oct 1, 2026 00:00:00").getTime();

        // প্রতি ১ সেকেন্ড (১০০০ মিলি সেকেন্ড) অন্তর আপডেট হবে
        var x = setInterval(function() {

            // বর্তমান সময় নেওয়া
            var now = new Date().getTime();

            // লক্ষ্য সময় ও বর্তমান সময়ের পার্থক্য
            var distance = countDownDate - now;

            // দিন, ঘণ্টা, মিনিট ও সেকেন্ডের গাণিতিক হিসাব
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // সংখ্যা যদি ৯-এর কম হয় তবে আগে একটি '০' যোগ করার ফাংশন
            function formatTime(time) {
                return time < 10 ? "0" + time : time;
            }

            // HTML এলিমেন্টে মানগুলো বসানো
            document.getElementById("days").innerHTML = formatTime(days);
            document.getElementById("hours").innerHTML = formatTime(hours);
            document.getElementById("minutes").innerHTML = formatTime(minutes);
            document.getElementById("seconds").innerHTML = formatTime(seconds);

            // যদি সময় শেষ হয়ে যায়
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<h2 class='text-warning'>আমরা এখন লাইভ!</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
