<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Post-Eid Exam Master | Md. Ariful Islam</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --glass: rgba(255, 255, 255, 0.08); }
        body {
            background: linear-gradient(rgba(0,0,0,0.92), rgba(0,0,0,0.92)), 
                        url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-attachment: fixed; color: #f4f4f4;
            font-family: 'Hind Siliguri', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        /* সমান উচ্চতার জন্য গ্রিড ফিক্স */
        .master-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); 
            gap: 25px; 
            width: 100%; 
            max-width: 1300px; 
            align-items: stretch; 
        }

        .card { 
            background: var(--glass); 
            padding: 25px; 
            border-radius: 15px; 
            border-top: 4px solid var(--gold); 
            backdrop-filter: blur(10px); 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
        }

        .main-timer-box { text-align: center; background: var(--glass); padding: 30px; border-radius: 20px; border: 1px solid var(--gold); margin-bottom: 40px; width: 95%; max-width: 850px; }
        .wisdom-box { background: rgba(212, 175, 55, 0.15); border: 1px solid var(--gold); padding: 20px; border-radius: 15px; text-align: center; width: 95%; max-width: 850px; margin-bottom: 25px; }
        
        .title { font-size: 1.3rem; color: var(--gold); font-weight: bold; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 10px; margin-bottom: 15px; }
        textarea, input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; border-radius: 8px; color: #eee; padding: 12px; font-family: inherit; margin-bottom: 10px; }
        .save-btn { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: auto; }
        
        /* Settings */
        .settings-btn { position: fixed; bottom: 20px; right: 20px; background: var(--gold); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; }
        .settings-panel { position: fixed; bottom: 80px; right: 20px; width: 300px; background: #111; border: 1px solid var(--gold); border-radius: 15px; padding: 15px; display: none; z-index: 1000; max-height: 50vh; overflow-y: auto; }
        .settings-panel.open { display: block; }
    </style>
</head>
<body>

    <div class="wisdom-box">
        <div id="w-t">পড়ুন আপনার রবের নামে...</div>
        <div id="w-s">— আল কুরআন</div>
    </div>

    <div class="main-timer-box">
        <h2 id="m-status" style="color: var(--gold); font-size: 1.8rem;">🌙 ঈদ-উল-ফিতরের ছুটির পর পরীক্ষা হবে</h2>
        <p style="color: #aaa;">নতুন সময়সূচি পরবর্তীতে জানানো হবে।</p>
    </div>

    <h1 id="h-title">Md. Ariful Islam | Exam Tracker</h1>
    
    <div class="master-grid" id="main-grid"></div>

    <div class="settings-btn" onclick="document.getElementById('settings-panel').classList.toggle('open')">⚙️</div>
    <div class="settings-panel" id="settings-panel">
        <h3 style="color:var(--gold);">Settings</h3>
        <input type="text" id="edit-h" placeholder="Headline">
        <div id="edit-list"></div>
        <button class="save-btn" onclick="location.reload()">Save Configuration</button>
    </div>

    <script>
        const def = [
            { id: 0, code: "LAW 311", name: "CrPC (Completed?)", date: "" },
            { id: 1, code: "LAW 313", name: "CPC", date: "" },
            { id: 2, code: "LAW 317", name: "Intellectual Property", date: "" },
            { id: 3, code: "LAW 315", name: "Registration", date: "" },
            { id: 4, code: "LAW 319", name: "Ethics", date: "" }
        ];

        let courses = JSON.parse(localStorage.getItem('arif_v3')) || def;
        let head = localStorage.getItem('arif_h3') || "Md. Ariful Islam Dashboard";

        const grid = document.getElementById('main-grid');
        courses.forEach(c => {
            grid.innerHTML += `
                <div class="card">
                    <div>
                        <div class="title">${c.code}: ${c.name}</div>
                        <div id="st-${c.id}" style="text-align:center; font-size:0.9rem; color:#ccc; margin-bottom:15px;">Pending Update</div>
                        <textarea id="ts-${c.id}" placeholder="সাজেশন এখানে..." style="height: 100px;"></textarea>
                    </div>
                    <button class="save-btn" onclick="saveSub(${c.id})">সেভ করো</button>
                </div>`;
        });

        grid.innerHTML += `
            <div class="card">
                <div class="title">🛡️ Exam Checklist</div>
                <div style="flex-grow: 1;">
                    ${["Admit Card", "ID Card (SIU)", "Registration", "Pens", "Watch"].map((it, i) => `
                    <div style="display:flex;gap:10px; margin-bottom:10px;"><input type="checkbox" id="ck-${i}" onchange="saveCk()"> <label>${it}</label></div>`).join('')}
                </div>
            </div>
            <div class="card">
                <div class="title">📖 My Legal Thoughts</div>
                <textarea id="diary" style="flex-grow: 1; min-height: 180px;" placeholder="তোমার বিশেষ ডায়েরি নোট..."></textarea>
                <button class="save-btn" onclick="saveD()">ডায়েরি সেভ করো</button>
            </div>`;

        function saveSub(id) { localStorage.setItem(`s_s_${id}`, document.getElementById(`ts-${id}`).value); alert('Saved!'); }
        function saveD() { localStorage.setItem('s_d', document.getElementById('diary').value); alert('Saved!'); }
        function saveCk() { for(let i=0; i<5; i++) localStorage.setItem(`s_c_${i}`, document.getElementById(`ck-${i}`).checked); }

        window.onload = function() {
            document.getElementById('h-title').innerText = head;
            const elist = document.getElementById('edit-list');
            courses.forEach((c, i) => {
                const s = localStorage.getItem(`s_s_${c.id}`); if(s) document.getElementById(`ts-${c.id}`).value = s;
                elist.innerHTML += `<div><input type="text" value="${c.code}" onchange="courses[${i}].code=this.value; localStorage.setItem('arif_v3', JSON.stringify(courses))"></div>`;
            });
            const dy = localStorage.getItem('s_d'); if(dy) document.getElementById('diary').value = dy;
            for(let i=0; i<5; i++) if(localStorage.getItem(`s_c_${i}`) === 'true') document.getElementById(`ck-${i}`).checked = true;
        };
    </script>
</body>
</html>
